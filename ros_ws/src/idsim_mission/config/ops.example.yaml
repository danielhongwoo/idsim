# vehicle_ops.launch.py의 params 예시(기체 px4_1, MAV_SYS_ID 2). 실제 파일은 생성기가
# artifacts/runs/<id>/params/ops-N.yaml로 만든다(decisions.md 쟁점 2). 생성기는 아래 넷만 만든다.
# 타임아웃, command_source.*, lifecycle.self_start는 노드 선언 기본값을 쓴다.
/**:
  ros__parameters:
    use_sim_time: true
    vehicle.id: px4_1
    vehicle.ns: /px4_1
    vehicle.sysid: 2
