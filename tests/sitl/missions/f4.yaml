# F4(1b decisions.md 쟁점 15, U13): 합친 미션 [TAKEOFF 5 m, GOTO x 2, TRACK_ENTITY, RTL]. roadmap 1b 목표 그대로의 미션 하나.
# 보는 것: waypoint 도달(정답 판정, b의 표본), 표적 접근, RTL 착륙 위치(R4), 착륙 후 disarm. 끝 상태 지상 DISARMED.
# 기체는 F3이 내려앉은 (6, 7, 0) 근처에서 이륙한다. 표적은 F2와 같은 car_1이고(loop true) 시작 위상은 앞 비행의 시간에
# 따라 달라진다. TRACK_ENTITY timeout 30 s의 근거는 f2.yaml과 같다(항목 시작점이 같은 (29, 15, 5)다).
# RTL timeout은 60 s다(쟁점 9). 기준점은 F4 자신의 이륙 직전 정답 위치다. acceptance_radius_m은 보정 값 0.5 m다.
mission_id: f4-combined
items:
  - type: TAKEOFF
    timeout_s: 20
    height_m: 5.0
    acceptance_m: 0.3
  - type: GOTO
    timeout_s: 15
    position: [16.0, 7.0, 5.0]
    acceptance_radius_m: 0.5
  - type: GOTO
    timeout_s: 15
    position: [29.0, 15.0, 5.0]
    acceptance_radius_m: 0.5
  - type: TRACK_ENTITY
    timeout_s: 30
    target_id: car_1
    offset: [0.0, 0.0, 5.0]
    acceptance_radius_m: 0.5
  - type: RTL
    timeout_s: 60
