# 생성 파일. tools/gen_compose.py가 config/fleet.yaml의 targets에서 만든다. 손으로 고치지 않는다.
# 표적 궤적만 담는다. 발행 주기는 노드 선언 기본값을 쓴다.
/**:
  ros__parameters:
    use_sim_time: true
    target_ids: ["target_a", "target_b"]
    targets.target_a.start_s: 0.0
    targets.target_a.loop: true
    targets.target_a.t: [0.0, 10.0, 20.0, 30.0]
    targets.target_a.x: [20.0, 20.0, 40.0, 20.0]
    targets.target_a.y: [0.0, 20.0, 20.0, 0.0]
    targets.target_a.z: [3.0, 3.0, 5.0, 3.0]
    targets.target_b.start_s: 5.5
    targets.target_b.loop: false
    targets.target_b.t: [0.0, 8.0, 12.0]
    targets.target_b.x: [-15.5, -15.5, -15.5]
    targets.target_b.y: [12.25, -3.75, -3.75]
    targets.target_b.z: [0.0, 0.5, 0.5]
