# Phase 1a 스모크용 compose. 1단계 임시 파일이며 3단계에서 tools/gen_compose.py가 대체한다.
# tests/smoke/run_smoke.sh가 필수 변수(IDSIM_ROS_DOMAIN_ID, IDSIM_GZ_PARTITION, IDSIM_AGENT_PORT, IDSIM_INSTANCE, IDSIM_PX4_ARGS,
# IDSIM_PX4_NS, IDSIM_ULOG_HOST_DIR, IDSIM_ULOG_SUBDIR)를 오프셋과 인스턴스 번호 하나씩에서 계산해 넘긴다.
# 이 파일의 직접 실행은 지원하지 않는다. 변수가 없으면 보간 단계에서 실패한다.
# 스택 번호 k -> ROS_DOMAIN_ID = 20 + k, GZ_PARTITION = idsim-k, 에이전트 포트 = 8888 + k (run_smoke.sh가 계산). 기체 번호 N(IDSIM_INSTANCE) -> -i N, 네임스페이스 px4_N.
# 프로필: embedded (S1, S1b), standalone (S2 이후, S5의 bridge 포함).
# S1은 인스턴스 0(명령 `px4`, 네임스페이스 없음), 나머지는 -i ${IDSIM_INSTANCE}.

name: idsim-smoke

x-ros-env: &ros-env
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  PYTHONDONTWRITEBYTECODE: "1"
  CYCLONEDDS_URI: file:///opt/idsim/config/cyclonedds.xml
  ROS_DOMAIN_ID: ${IDSIM_ROS_DOMAIN_ID:?}

x-ros-ws: &ros-ws
  image: idsim/ros-ws:local
  network_mode: host
  restart: "no"
  volumes:
    - ..:/opt/idsim
    - ../config/cyclonedds.xml:/opt/idsim/config/cyclonedds.xml:ro

x-px4-env: &px4-env
  PX4_SYS_AUTOSTART: "4001"
  PX4_SIM_MODEL: gz_x500
  PX4_GZ_WORLD: default
  PX4_GZ_MODELS: /opt/px4-gz/models
  PX4_GZ_MODEL_POSE: "0,0,0,0,0,0"
  PX4_UXRCE_DDS_PORT: ${IDSIM_AGENT_PORT:?}
  ROS_DOMAIN_ID: ${IDSIM_ROS_DOMAIN_ID:?}
  GZ_PARTITION: ${IDSIM_GZ_PARTITION:?}
  GZ_IP: 127.0.0.1

services:
  xrce-agent:
    image: idsim/xrce-agent:local
    network_mode: host
    restart: "no"
    profiles: [embedded, standalone]
    # ROS_DOMAIN_ID는 주지 않는다. 도메인은 PX4 client가 세션 생성 때 넘긴다.
    command: ["udp4", "-p", "${IDSIM_AGENT_PORT:?}"]
    healthcheck:
      # /proc/net/udp의 local_address 열에 포트(16진수 4자리)가 바인드된 행이 있는지 본다 (st 열은 안 본다)
      test:
        - CMD-SHELL
        - 'p=$$(printf "%04X" ${IDSIM_AGENT_PORT:?}); grep -qE "^ *[0-9]+: [0-9A-F]+:$$p " /proc/net/udp'
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  gazebo:
    image: idsim/sim-base:local
    network_mode: host
    restart: "no"
    profiles: [standalone]
    environment:
      GZ_PARTITION: ${IDSIM_GZ_PARTITION:?}
      GZ_IP: 127.0.0.1
      GZ_SIM_SERVER_CONFIG_PATH: /opt/px4-gz/server.idsim.config
      GZ_SIM_RESOURCE_PATH: /opt/px4-gz/models:/opt/px4-gz/worlds
      PX4_GZ_WORLD: default
    command: ["bash", "-c", "exec gz sim -r -s /opt/px4-gz/worlds/$${PX4_GZ_WORLD}.sdf"]
    healthcheck:
      test: ["CMD-SHELL", "gz service -l | grep -q /world/$${PX4_GZ_WORLD}/scene/info"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      xrce-agent:
        condition: service_healthy

  # S1, S1b: PX4가 Gazebo를 직접 띄운다 (embedded).
  px4-embedded:
    image: idsim/px4:local
    network_mode: host
    restart: "no"
    profiles: [embedded]
    working_dir: /opt/PX4-Autopilot/build/px4_sitl_default/rootfs
    env_file:
      - ../config/px4/sitl_params.env
    environment:
      <<: *px4-env
      PX4_UXRCE_DDS_NS: ${IDSIM_PX4_NS?}
      HEADLESS: "1"
    command: ["bash", "-c", "exec px4 ${IDSIM_PX4_ARGS?}"]
    volumes:
      - ${IDSIM_ULOG_HOST_DIR:?}:/opt/PX4-Autopilot/build/px4_sitl_default/rootfs/${IDSIM_ULOG_SUBDIR:?}
    healthcheck:
      # --instance 1 기준이므로 S1(인스턴스 0)에서는 맞지 않는다. S1은 run_smoke.sh가 직접 판정한다.
      test: ["CMD-SHELL", "px4-uxrce_dds_client --instance ${IDSIM_INSTANCE:?} status | grep -q 'Running, connected'"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 90s
    depends_on:
      xrce-agent:
        condition: service_healthy

  # S2 이후: Gazebo는 gazebo 서비스가 띄운다 (standalone).
  px4:
    image: idsim/px4:local
    network_mode: host
    restart: "no"
    profiles: [standalone]
    working_dir: /opt/PX4-Autopilot/build/px4_sitl_default/rootfs
    env_file:
      - ../config/px4/sitl_params.env
    environment:
      <<: *px4-env
      PX4_GZ_STANDALONE: "1"
      PX4_UXRCE_DDS_NS: px4_${IDSIM_INSTANCE:?}
    # -d: pxh 대화형 셸 없이 데몬으로 실행한다 (stdin이 닫힌 컨테이너에서 pxh가 프롬프트를 무한 출력하는 것을 막는다)
    command: ["px4", "-d", "-i", "${IDSIM_INSTANCE:?}"]
    volumes:
      - ${IDSIM_ULOG_HOST_DIR:?}:/opt/PX4-Autopilot/build/px4_sitl_default/rootfs/${IDSIM_ULOG_SUBDIR:?}
    healthcheck:
      test: ["CMD-SHELL", "px4-uxrce_dds_client --instance ${IDSIM_INSTANCE:?} status | grep -q 'Running, connected'"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 45s
    depends_on:
      xrce-agent:
        condition: service_healthy
      gazebo:
        condition: service_healthy

  # S5: gazebo의 /clock을 ROS 2로 브리지한다.
  bridge:
    <<: *ros-ws
    profiles: [standalone]
    environment:
      <<: *ros-env
      GZ_PARTITION: ${IDSIM_GZ_PARTITION:?}
      GZ_IP: 127.0.0.1
    command:
      - ros2
      - run
      - ros_gz_bridge
      - parameter_bridge
      - "/clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock"
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/$${ROS_DISTRO}/setup.sh && timeout 4 ros2 topic echo --once --no-daemon /clock > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      px4:
        condition: service_healthy

  # 1회 실행 서비스. run_smoke.sh가 `compose run --rm <서비스> <명령>`으로 쓴다.
  smoke-embedded:
    <<: *ros-ws
    profiles: [embedded]
    environment:
      <<: *ros-env
    command: ["true"]
    depends_on:
      px4-embedded:
        condition: service_started

  smoke:
    <<: *ros-ws
    profiles: [standalone]
    environment:
      <<: *ros-env
    command: ["true"]
    depends_on:
      bridge:
        condition: service_healthy
