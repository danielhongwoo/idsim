# unit: ros-ws 이미지 안에서 ROS 2 패키지를 빌드하고 GoogleTest/ament_lint 테스트와 clang-tidy를 돌린다.
# 실제 단계는 tools/ros_ws.sh ci 한 곳에 있고 로컬에서도 같은 명령을 쓴다.
#
# ros-ws 이미지는 build 워크플로가 main에서 GHCR에 올린 <REGISTRY>/ros-ws:<key>를 받는다. key가 없으면
# (Dockerfile.ros-ws나 versions.env를 바꾸는 PR, 또는 패키지가 비공개라 받지 못하는 경우) 러너에서
# tools/ci/build_images.py --mode load ros-ws 로 직접 빌드한다. 이 분기는 ros-base부터 다시 빌드한다.
#
# 단계별 시간은 GITHUB_STEP_SUMMARY의 표로 남는다(이미지 확보 단계와 tools/ros_ws.sh의 build, test, tidy).
# 트리거와 concurrency는 lint 워크플로와 같다(pull_request + push: main. PR의 옛 실행은 취소).
name: unit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: unit-${{ github.ref }}
  # PR의 옛 실행은 취소한다. main에서는 취소하지 않는다(push마다 결과가 남아야 한다).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (ros_ws)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull ros-ws image
        id: pull
        run: |
          t0=$(date +%s)
          # eval "$(...)"는 스크립트가 실패해도 0을 돌려주므로 출력을 먼저 받아 실패를 검사한다
          keys_env="$(tools/ci/image_keys.py --format env)" || { echo "image_keys.py 실패" >&2; exit 1; }
          eval "$keys_env"
          : "${KEY_ROS_WS:?image_keys.py가 KEY_ROS_WS를 내지 않았다}"
          registry="$(sed -n 's/^REGISTRY=//p' docker/versions.env)"
          ref="${registry}/ros-ws:${KEY_ROS_WS}"
          if docker pull --quiet "$ref"; then
            docker tag "$ref" idsim/ros-ws:local
            echo "pulled=true" >> "$GITHUB_OUTPUT"
            echo "ros-ws ${KEY_ROS_WS}: pull"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=unit::레지스트리에 ros-ws ${KEY_ROS_WS}가 없어 러너에서 빌드한다"
          fi
          t1=$(date +%s)
          {
            echo "| 단계 | 초 |"
            echo "| --- | --- |"
            echo "| pull ros-ws (${KEY_ROS_WS}) | $((t1 - t0)) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: set up buildx
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: build ros-ws image (no key in registry)
        if: steps.pull.outputs.pulled != 'true'
        env:
          # build-images.yml과 같은 이유로 러너(미국)는 우분투 기본 미러를 쓴다. 미러는 이미지 key에 들어가지 않는다.
          UBUNTU_APT_MIRROR: http://archive.ubuntu.com/ubuntu
        run: |
          t0=$(date +%s)
          tools/ci/build_images.py --mode load ros-ws
          t1=$(date +%s)
          echo "| build ros-base + ros-ws | $((t1 - t0)) |" >> "$GITHUB_STEP_SUMMARY"

      - name: tools/ros_ws.sh ci
        run: tools/ros_ws.sh ci

      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-logs
          path: |
            ros_ws/log/
            ros_ws/build/*/test_results/
          if-no-files-found: warn
          retention-days: 7
