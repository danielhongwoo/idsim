# unit: ros-ws 이미지 안에서 ROS 2 패키지를 빌드하고 GoogleTest/ament_lint 테스트와 clang-tidy를 돌린다.
# 실제 단계는 tools/ros_ws.sh ci 한 곳에 있고 로컬에서도 같은 명령을 쓴다.
#
# 플랫폼: linux/amd64(ubuntu-24.04)와 linux/arm64(ubuntu-24.04-arm) 두 native runner에서 같은 단계를 돈다.
#   matrix.include는 tools/ci/image_keys.py의 CI_MATRIX와 같아야 한다(tests/tools/test_image_keys.py가 검사).
# ros-ws 이미지는 build workflow가 main에서 GHCR에 올린 <REGISTRY>/ros-ws:<key>(multi-arch index)에서 그 runner의
# 플랫폼 이미지를 받는다(tools/ci/build_images.py --mode pull ros-ws). key가 없거나 태그에 그 플랫폼이 없으면
# (Dockerfile.ros-ws나 versions.env를 바꾸는 PR, 또는 패키지가 비공개라 받지 못하는 경우) runner에서
# tools/ci/build_images.py --mode load ros-ws 로 직접 빌드한다. 이 분기는 ros-base부터 다시 빌드한다.
#
# 단계별 시간은 GITHUB_STEP_SUMMARY의 표로 남는다(이미지 확보 단계와 tools/ros_ws.sh의 build, test, tidy).
# trigger와 concurrency는 lint workflow와 같다(pull_request + push: main. PR의 옛 실행은 취소).
# 대가: base와 충돌이 있는 PR에서는 pull_request 실행이 돌지 않는다. key는 PR merge commit 기준이고
# re-run은 처음 merge SHA를 쓰므로 main의 새 key 반영에는 새 push가 필요하다.
name: unit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  # PR: 같은 ref면 옛 실행 취소. main: 실행마다 group이 달라 대기 중 실행도 취소되지 않는다(push마다 결과가 남는다).
  group: unit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # amd64의 이름은 그대로 둔다(필수 검사 이름). 다른 플랫폼만 뒤에 아키텍처를 붙인다.
    name: unit (ros_ws${{ matrix.arch != 'amd64' && format(', {0}', matrix.arch) || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            apt_mirror: http://archive.ubuntu.com/ubuntu
          - arch: arm64
            runner: ubuntu-24.04-arm
            apt_mirror: ""
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull ros-ws image
        id: pull
        run: |
          t0=$(date +%s)
          # eval "$(...)"는 스크립트가 실패해도 0을 돌려주므로 출력을 먼저 받아 실패를 검사한다
          keys_env="$(tools/ci/image_keys.py --format env)" || { echo "image_keys.py 실패" >&2; exit 1; }
          eval "$keys_env"
          : "${KEY_ROS_WS:?image_keys.py가 KEY_ROS_WS를 내지 않았다}"
          # 이 runner 플랫폼의 manifest가 태그에 있는지 보고 받아 idsim/ros-ws:local로 태그한다
          if tools/ci/build_images.py --mode pull ros-ws; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
            echo "ros-ws ${KEY_ROS_WS}: pull"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=unit::registry에 ros-ws ${KEY_ROS_WS}의 이 플랫폼 이미지가 없어 runner에서 빌드한다"
          fi
          t1=$(date +%s)
          {
            echo "| 단계 | 초 |"
            echo "| --- | --- |"
            echo "| pull ros-ws (${KEY_ROS_WS}) | $((t1 - t0)) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: set up buildx
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: build ros-ws image (no key in registry)
        if: steps.pull.outputs.pulled != 'true'
        env:
          # 의미는 image_keys.py의 CI_MATRIX 주석. 미러는 이미지 key에 들어가지 않는다.
          UBUNTU_APT_MIRROR: ${{ matrix.apt_mirror }}
        run: |
          t0=$(date +%s)
          tools/ci/build_images.py --mode load ros-ws
          t1=$(date +%s)
          echo "| build ros-base + ros-ws | $((t1 - t0)) |" >> "$GITHUB_STEP_SUMMARY"

      - name: tools/ros_ws.sh ci
        run: tools/ros_ws.sh ci

      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unit-logs-${{ matrix.arch }}
          path: |
            ros_ws/log/
            ros_ws/build/*/test_results/
          if-no-files-found: warn
          retention-days: 7
