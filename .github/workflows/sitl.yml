# sitl: 이륙-호버-착륙 통합 테스트(시나리오 B, C, A, D, F1-F4, T). 실제 단계는 호스트 wrapper tests/sitl/run_sitl.sh 한 곳에
# 있고 로컬에서도 같은 명령을 쓴다(스택은 tests/sitl/fleet.yaml, targets와 sim-oracle 포함). 이 workflow는 시나리오를 모른다.
#
# trigger: PR 머리 커밋마다(draft와 문서만 바뀐 PR 제외), main push, 수동 실행.
#   같은 PR의 옛 실행은 취소한다. 자동 재시도는 없다(다시 돌릴 때는 re-run 또는 workflow_dispatch).
#   3대 시나리오는 이 job에 넣지 않는다(Phase 3의 nightly 전용).
# 문서만 바뀐 PR을 workflow 수준 paths로 거르지 않는 이유: 필수 검사로 걸었을 때 대기 상태로 남는다.
#   그래서 앞에 changes job(git diff로 코드 경로 변경 여부를 output으로 낸다. 외부 action 없음)을 두고
#   sitl job이 그 output을 보고 건너뛴다. main push와 수동 실행은 건너뛰지 않는다.
#   건너뛰기는 job 수준 if가 아니라 첫 step(gate)과 step 수준 if로 한다. job 수준 if가 false이면 matrix가 펼쳐지지 않아
#   check 이름이 이름 식 그대로 나오고 필수 검사 `sitl`, `sitl (arm64)`가 보고되지 않는다. 그래서 sitl job은 늘 두 runner로
#   펼쳐지고(changes가 draft로 건너뛰어도), gate가 건너뛸 때는 나머지 step을 모두 건너뛴다(checkout도 하지 않아 runner
#   시간은 job 시작 몇 초뿐이다). 이때 check는 success로 끝나므로 판정을 돌리지 않았다는 사실을 notice 주석과 step summary
#   첫 줄("sitl 건너뜀")로 남긴다. changes job이 실패하면 gate가 실패시킨다(건너뜀으로 숨기지 않는다).
#
# 플랫폼: sitl job은 linux/amd64(ubuntu-24.04)와 linux/arm64(ubuntu-24.04-arm) 두 native runner에서 같은 단계를 돈다.
#   matrix.include는 tools/ci/image_keys.py의 CI_MATRIX와 같아야 한다(tests/tools/test_image_keys.py가 검사).
#   판정 기준값은 플랫폼과 무관하게 같다. artifact 이름 끝에 아키텍처를 붙인다.
# 이미지: build workflow가 main에서 GHCR에 올린 key 태그(multi-arch index)에서 그 runner의 플랫폼 이미지를 로그인 없이
#   받는다(tools/ci/build_images.py --mode pull). key가 없거나 태그에 그 플랫폼이 없으면(이미지를 바꾸는 PR) 이 job은
#   실패한다. 머지 전 확인은 build workflow의 수동 실행(입력 sitl)으로 하고, 이미지 PR을 main에 합쳐 build가 key를 올리게 한다.
#
# tests/sitl/run_sitl.sh 계약(test-engineer 소유. 이 workflow가 기대하는 것)
#   호출     tests/sitl/run_sitl.sh --stack 0
#   종료 코드  0 전체 통과, 0이 아니면 실패(이 workflow는 값을 구분하지 않는다)
#   stdout   마지막 줄이 실행 디렉터리 절대 경로(artifacts/runs/<실행 id>). 나머지는 stderr
#   요약     환경변수 GITHUB_STEP_SUMMARY가 있으면 단계별 초와 판정 구간 RTF를 표로 덧붙인다
#   산출물   artifacts/runs/<실행 id>/ 아래. 실패하면 이 디렉터리 전체를 올린다.
#            compose.yaml, stack.json, params/, px4-N/log/*.ulg, ros_log/, 서비스별 로그,
#            sitl/ (junit.xml, trace.jsonl, trace_ulog.json, verdict.json, summary.md, steps.tsv, 원시 표본과 ULog 교차 확인 결과,
#            logs/<서비스>.log. 전체 목록은 tests/sitl/README.md)
#            성공하면 sitl/junit.xml, sitl/trace.jsonl, sitl/trace_ulog.json, sitl/summary.md만 올린다.
#   소유     artifacts/runs/ 아래 파일은 모두 호스트 사용자 소유다.
name: sitl

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  # PR: 같은 ref면 옛 실행 취소. main과 수동 실행: 실행마다 group이 달라 대기 중 실행도 취소되지 않는다.
  group: sitl-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # PR은 merge commit(부모 둘)을 받는다. 첫째 부모(base 끝)와 비교하려면 깊이 2가 필요하다.
          fetch-depth: 2
      - name: code paths changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 코드 경로: ros_ws, docker, config, tools, tests와 이 workflow. 이 밖(docs, docs-for-agent, README 등)만 바뀌면 건너뛴다.
          pattern='^(ros_ws|docker|config|tools|tests)/|^\.github/workflows/sitl\.yml$'
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME}: 경로와 무관하게 돈다"
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            # merge commit이 아니면 비교 기준이 없다. 건너뛰지 않는 쪽이 안전하다.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "merge commit이 아니라 비교하지 못했다. 돈다"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee /tmp/changed.txt
          if grep -Eq "$pattern" /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "코드 경로가 바뀌었다. 돈다"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "코드 경로가 바뀌지 않았다. sitl을 건너뛴다"
          fi

  sitl:
    # amd64의 이름은 그대로 둔다(필수 검사 이름). 다른 플랫폼만 뒤에 아키텍처를 붙인다.
    name: sitl${{ matrix.arch != 'amd64' && format(' ({0})', matrix.arch) || '' }}
    needs: changes
    # 위 머리 주석의 건너뛰기 설계. changes가 건너뛰거나 실패해도 job은 펼쳐지고 gate가 판단한다.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: gate (run or skip)
        id: gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          case "$CHANGES_RESULT" in
            success)
              if [ "$CODE" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              reason="코드 경로가 바뀌지 않았다" ;;
            skipped) reason="draft PR이다" ;;
            *) echo "::error title=sitl::changes job이 ${CHANGES_RESULT}로 끝났다. 건너뛰지 않고 실패시킨다"; exit 1 ;;
          esac
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=sitl 건너뜀::${reason}. 시나리오 판정을 돌리지 않았다(이 check의 success는 판정 통과가 아니다)"
          echo "## sitl 건너뜀: ${reason}. 시나리오 판정을 돌리지 않았다" >> "$GITHUB_STEP_SUMMARY"

      - name: checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: docker version
        if: steps.gate.outputs.run == 'true'
        run: |
          # start_interval(ops-N와 bridge의 healthcheck)은 Docker Engine 25 이상이다. 실제 runner의 판을 남긴다.
          docker version
          docker compose version
          {
            echo "| 단계 | 초 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: pull images
        if: steps.gate.outputs.run == 'true'
        run: |
          t0=$(date +%s)
          tools/ci/build_images.py --mode pull
          t1=$(date +%s)
          echo "| pull images | $((t1 - t0)) |" >> "$GITHUB_STEP_SUMMARY"

      - name: build ros_ws
        if: steps.gate.outputs.run == 'true'
        run: |
          t0=$(date +%s)
          tools/ros_ws.sh build
          t1=$(date +%s)
          echo "| build ros_ws | $((t1 - t0)) |" >> "$GITHUB_STEP_SUMMARY"

      - name: tests/sitl/run_sitl.sh
        if: steps.gate.outputs.run == 'true'
        run: |
          t0=$(date +%s)
          tests/sitl/run_sitl.sh --stack 0
          t1=$(date +%s)
          echo "| run_sitl.sh (전체) | $((t1 - t0)) |" >> "$GITHUB_STEP_SUMMARY"

      - name: upload run records (failure)
        if: (failure() || cancelled()) && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sitl-run-failure-${{ matrix.arch }}
          path: |
            artifacts/runs/
            ros_ws/log/
          if-no-files-found: warn
          retention-days: 7

      - name: upload run records (success)
        if: success() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sitl-run-${{ matrix.arch }}
          path: |
            artifacts/runs/*/sitl/junit.xml
            artifacts/runs/*/sitl/trace.jsonl
            artifacts/runs/*/sitl/trace_ulog.json
            artifacts/runs/*/sitl/summary.md
          if-no-files-found: warn
          retention-days: 7
