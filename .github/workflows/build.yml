# build: 이미지 5종(ros-base, sim-base, px4, ros-ws, xrce-agent).
# 실제 단계는 재사용 workflow build-images.yml 과 tools/ci/build_images.py 에 있다. linux/amd64와 linux/arm64를
# 각자의 native runner에서 빌드한다(build-images.yml의 matrix).
#
# - PR, main 이외 브랜치의 수동 실행: 빌드와 스모크만 한다(푸시 없음). 포크 PR에는 쓰기 토큰이 없다.
#   권한은 contents: read, packages: read(레지스트리 key 확인과 캐시 읽기).
#   수동 실행의 입력 sitl이 true이면 두 runner에서 스모크 뒤에 tests/sitl/run_sitl.sh --stack 0도 돈다.
# - main push, main의 수동 실행: 플랫폼마다 key가 없는 이미지만 빌드해 GHCR에 푸시하고, 두 플랫폼이 모두 성공하면
#   key 태그를 multi-arch index로 병합한다. packages: write는 이 job만.
# 그 플랫폼의 이미지가 레지스트리에 이미 있으면 빌드하지 않는다(tools/ci/image_keys.py, build_images.py).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sitl:
        description: 스모크 뒤에 tests/sitl/run_sitl.sh --stack 0을 amd64와 arm64에서 돌린다(main 이외 브랜치)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  # main에서는 취소하지 않는다. 큰 이미지 빌드가 중간에 끊겨 다음 실행이 처음부터 다시 하는 것을 막는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (no push)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-images.yml
    with:
      push: false
      sitl: ${{ inputs.sitl || false }}

  publish:
    name: build and push (main)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
