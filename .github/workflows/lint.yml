# lint: PR과 main push에서 돈다(PR 없는 브랜치 push에는 돌지 않는다). 검사 내용은 tools/ci/lint.sh 한 곳에 있고 로컬에서도
# `tools/ci/lint.sh all` 로 같은 검사를 돌린다. 도구 버전은 docker/versions.env의 LINT_* 줄.
#
# 결과 표시: 검사마다 로그 마지막 줄이 "RESULT <검사>: <상태>" 이다.
#   PASS             대상이 있었고 통과
#   PASS-NO-TARGETS  대상 파일 0개라 검사 없이 통과 (notice 주석이 함께 남는다. 건너뜀이 아니다)
#   FAIL-NOT-WIRED   대상 파일이 생겼는데 검사가 아직 연결되지 않음 (cargo). 연결할 때까지 실패한다
# clang-tidy와 ament_lint는 이 워크플로에 없다. compile_commands.json과 ROS 헤더가 필요해서 unit 워크플로
# (tools/ros_ws.sh ci)의 ros-ws 컨테이너 안에서 돈다. 이 워크플로에서 "통과"로 보이는 가짜 항목을 두지 않는다.
# 매트릭스 job은 if 조건으로 건너뛰지 않는다. GitHub UI에서 "skipped"로 보이는 lint job은 없어야 한다.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  # PR의 옛 실행은 취소한다. main에서는 취소하지 않는다(push마다 결과가 남아야 한다).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - charset
          - shellcheck
          - ruff
          - hadolint
          - actionlint
          - yamllint
          - pytest
          - compose-config
          - clang-format
          - px4-api
          - cargo
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: tools/ci/lint.sh ${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
        run: tools/ci/lint.sh "$CHECK"
