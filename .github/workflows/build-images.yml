# build.yml이 부르는 재사용 워크플로. 권한은 부르는 job이 정한다(PR: packages read, main: packages write).
#
# 무료 러너(4 vCPU, 16 GB, 루트 디스크 여유 약 14 GB) 대응
# - plan 단계에서 key를 확인해 빌드할 것이 없으면 정리와 빌드를 하지 않는다(대부분의 실행).
# - 빌드할 것이 있으면 먼저 러너의 쓰지 않는 도구(dotnet, Android SDK, GHC, CodeQL 등)를 지워
#   루트 디스크를 넓힌다. px4 builder 단계만 7.7 GB이고 sim-base 2.97 GB 위에 쌓이므로 14 GB로는 모자란다.
# - --load를 쓰지 않는다. 결과는 레지스트리로 바로 푸시하거나(main) 빌더 캐시에만 둔다(PR).
#   docker 이미지 저장소에 한 번 더 풀어 두면 같은 데이터가 두 벌이 된다.
# - 레이어 캐시는 type=registry, mode=min. 최종 이미지 레이어만 내보내고 px4 builder 단계(7.7 GB)는
#   내보내지 않는다. 근거는 tools/ci/build_images.py 와 보고서 참조.
name: build-images

on:
  workflow_call:
    inputs:
      push:
        description: true면 main 푸시 모드, false면 빌드만
        type: boolean
        required: true

jobs:
  images:
    name: images (${{ inputs.push && 'push' || 'no push' }})
    runs-on: ubuntu-24.04
    # 콜드 빌드 추정: ros-base 약 5분, sim-base 약 8분, px4 약 15-20분, ros-ws 약 8분, xrce-agent 약 10분
    timeout-minutes: 150
    env:
      MODE: ${{ inputs.push && 'push' || 'pr' }}
      # 러너(미국)에서는 kr 미러가 느리거나 불안정할 것으로 추정되므로(미실측) 우분투 기본 미러로 덮어쓴다.
      # versions.env의 UBUNTU_APT_MIRROR(호스트 로컬 빌드용)보다 이 환경변수가 우선한다(build_images.py).
      # 미러는 이미지 key에 들어가지 않으므로 GHCR key와 캐시에 영향이 없다.
      UBUNTU_APT_MIRROR: http://archive.ubuntu.com/ubuntu
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx (docker-container driver)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image keys
        run: tools/ci/image_keys.py

      - name: plan (registry key check)
        id: plan
        run: tools/ci/build_images.py --mode "$MODE" --plan

      - name: free runner disk
        if: steps.plan.outputs.need_build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af
          df -h /

      - name: build
        if: steps.plan.outputs.need_build == 'true'
        run: tools/ci/build_images.py --mode "$MODE"

      - name: disk after build
        if: always() && steps.plan.outputs.need_build == 'true'
        run: |
          df -h /
          docker buildx du || true
